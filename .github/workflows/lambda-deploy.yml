name: Deploy Lambda Artifacts

on:

  push:

    branches:
      - main

    paths:
      - "backend/**"

permissions:
  contents: read

jobs:

  lambda:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package GET Lambda
        run: |
          cd backend/get_item
          zip get_item.zip lambda_function.py

      - name: Package PUT Lambda
        run: |
          cd backend/put_item
          zip put_item.zip lambda_function.py

      - name: Upload GET Lambda
        run: |
          aws s3 cp \
          backend/get_item/get_item.zip \
          s3://awesome-app-lambda-artifacts-seidutee/lambda/get_item/latest.zip

      - name: Upload PUT Lambda
        run: |
          aws s3 cp \
          backend/put_item/put_item.zip \
          s3://awesome-app-lambda-artifacts-seidutee/lambda/put_item/latest.zip